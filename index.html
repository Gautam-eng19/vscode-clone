<!DOCTYPE html>
<html>
  <head>
    <title>Visual Studio Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/header.css">
  </head>

  <body>

    <header class="header">
      <div class="left-section">
          <img class="vs-icon" src="icons/vs-icon.png">
        <div class="vs-heading"><p>Visual Studio Code</p></div>
      </div>

      <div class="middle-section">
        <div class="navbar-features">
          <p>Features</p>
        </div>
        <div class="navbar-features">
          <p>
            Docs
          </p>
        </div>
        <div class="navbar-features">
          <p>
            Updates
          </p>
        </div>
        <div class="navbar-features">
          <p>
            Blog
          </p>
        </div>
        <div class="navbar-features">
          <p>
            Extensions
          </p>
        </div>
        <div class="navbar-features">
          <p>
            MCP
          </p>
        </div>
        <div class="navbar-features">
          <p>
            FAQ
          </p>
        </div>
        <div class="navbar-features">
          <p>
            Learn
          </p>
        </div>
        <div class="navbar-features">
          <p>
            Events
          </p>
        </div>
      </div>

      <div class="right-section">
          <img class="search" src="icons/search-icon.svg">
          <img class="brightness" src="icons/light-theme-icon.svg">
        <button class="download">Download</button>
      </div>
    </header>

    <div class="popup">
      <div class="popup-detail"></div>
      <div class="popup-cross"></div>
    </div>

  </body>
</html>
